name: Scheduled Python Run

on:
  schedule:
    - cron: '*/40 * * * *'  
  workflow_dispatch: # Allows you to also trigger the script manually from GitHub

jobs:
  run-periodic-task:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Configure Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install required packages
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright Chromium & Dependencies
      run: |
        python -m playwright install chromium --with-deps

    - name: Execute script file
      id: run_script
      env:
        RAW_URL_API: ${{ secrets.RAW_URL_API }}
      run: |
        # Run script, capture output to terminal AND log file simultaneously
        python secure.py 2>&1 | tee script_output.log
        
    - name: Upload Logs & Send Discord Notification
      if: always() # Ensures you get notified whether your script passes or crashes
      env:
        WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        # 1. Upload the generated log file anonymously via POST
        if [ -f script_output.log ]; then
          PASTE_URL=$(curl -s --data-binary @script_output.log https://paste.c-net.org/)
        else
          PASTE_URL="No log file generated."
        fi

        # 2. Determine workflow outcome to toggle UI design properties
        if [ "${{ steps.run_script.outcome }}" = "success" ]; then
          STATUS_TITLE="✅ Script Executed Successfully"
          STATUS_COLOR=5763719 # Vibrant Green
          STATUS_DESC="The scheduled run completed without errors."
        else
          STATUS_TITLE="❌ Script Execution Failed"
          STATUS_COLOR=15548997 # Crimson Red
          STATUS_DESC="An error occurred during execution. Inspect the full raw text dump below."
        fi

        # 3. Deliver embed data array linking directly to your log link
        curl -H "Content-Type: application/json" \
        -X POST \
        -d "{
          \"username\": \"GitHub Automation\",
          \"avatar_url\": \"https://githubassets.com\",
          \"embeds\": [{
            \"title\": \"$STATUS_TITLE\",
            \"description\": \"$STATUS_DESC\",
            \"color\": $STATUS_COLOR,
            \"fields\": [
              {
                \"name\": \"Workflow Name\",
                \"value\": \"${{ github.workflow }}\",
                \"inline\": true
              },
              {
                \"name\": \"Trigger Event\",
                \"value\": \"${{ github.event_name }}\",
                \"inline\": true
              },
              {
                \"name\": \"📄 Live Console Output Logs\",
                \"value\": \"[Click here to view full console logs]($PASTE_URL)\",
                \"inline\": false
              },
              {
                \"name\": \"🛠️ GitHub Actions Run Panel\",
                \"value\": \"[View Workflow Run Interface](https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }})\",
                \"inline\": false
              }
            ]
          }]
        }" $WEBHOOK_URL
